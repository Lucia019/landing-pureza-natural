nav ul{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;list-style:none;scrollbar-width:none}
nav ul::-webkit-scrollbar{display:none}
nav a{white-space:nowrap;text-decoration:none;font-size:14px;font-weight:600;color:var(--deep);border:1.5px solid var(--deep);border-radius:999px;padding:7px 16px;min-height:36px;display:inline-flex;align-items:center;transition:background .3s,color .3s}
nav a:hover,nav a:focus-visible{background:var(--deep);color:var(--canvas);outline:none}
nav a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
main{max-width:760px;margin:0 auto;padding:18px 16px 40px}
figure{margin:0 0 32px;scroll-margin-top:76px}
figure img{display:block;width:100%;height:auto;border-radius:24px;box-shadow:0 30px 60px -40px rgba(23,76,70,.35);background:var(--panel);border:1px solid var(--line)}
.dl{display:inline-block;margin-top:12px;font-size:14px;font-weight:600;color:var(--water);text-decoration:underline;text-underline-offset:3px}

footer{max-width:760px;margin:0 auto;padding:0 16px 44px;text-align:center}
